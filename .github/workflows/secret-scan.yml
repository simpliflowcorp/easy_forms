name: Secret Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --verbose --config=.gitleaks.toml

      - name: Check for NVIDIA API keys
        run: |
          if grep -rn "nvapi-" src/; then
            echo "ERROR: Found NVIDIA API key pattern in source code"
            exit 1
          fi
          echo "No NVIDIA API keys found in source"