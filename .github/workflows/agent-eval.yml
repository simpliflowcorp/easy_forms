name: Agent Evaluation

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/agent/**'
      - 'src/lib/llmClient.ts'
      - 'src/lib/agentTools.ts'
      - 'tests/agent/eval/**'
  push:
    branches: [main, develop]
    paths:
      - 'src/agent/**'
      - 'src/lib/llmClient.ts'
      - 'src/lib/agentTools.ts'
      - 'tests/agent/eval/**'
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2 AM UTC

jobs:
  agent-eval:
    name: Agent Evaluation (Golden Prompts)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      NODE_ENV: test
      LLM_ALLOW_LEGACY_FALLBACK: "0"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Start Redis
        run: |
          docker run -d --name redis -p 6379:6379 redis:alpine
          sleep 2
      
      - name: Wait for MongoDB
        run: |
          # Wait for MongoDB to be ready
          for i in {1..30}; do
            if node -e "require('mongoose').connect(process.env.MONGODB_URI).then(() => process.exit(0)).catch(() => process.exit(1))"; then
              echo "MongoDB ready"
              break
            fi
            sleep 2
          done
      
      - name: Run Agent Evaluation
        run: npm run agent:eval
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          REDIS_URL: redis://localhost:6379
      
      - name: Upload Evaluation Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-results
          path: |
            tests/agent/eval/results.json
          retention-days: 7

  agent-typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit

  agent-lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint