name: Agent Evaluation

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/agent/**'
      - 'src/lib/llmClient.ts'
      - 'src/lib/agentTools.ts'
      - 'tests/agent/eval/**'
  push:
    branches: [main, develop]
    paths:
      - 'src/agent/**'
      - 'src/lib/llmClient.ts'
      - 'src/lib/agentTools.ts'
      - 'tests/agent/eval/**'
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2 AM UTC

jobs:
  # PR-gating suite (D-S3.5): fully mocked LLM, in-memory stores, < 30s,
  # no Mongo / Redis / NVIDIA credentials required. A stubbed-suite failure
  # fails the PR; a PR whose only live eval is `npm run agent:eval:live -- --skip`
  # passes CI.
  agent-eval:
    name: Agent Evaluation (Stubbed PR Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Stubbed Agent Evaluation (PR gate)
        run: npm run agent:eval

      - name: Upload Evaluation Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-stub-results
          path: |
            tests/agent/eval/reports/**
          retention-days: 7

  # Nightly live suite (D-S3.5): real LLM against Mongo + Redis. Writes the
  # report into tests/agent/eval/reports/ for drift comparison.
  agent-eval-live:
    name: Agent Evaluation (Nightly Live)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/heads/main')

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      NODE_ENV: test
      LLM_ALLOW_LEGACY_FALLBACK: "0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start Redis
        run: |
          docker run -d --name redis -p 6379:6379 redis:alpine
          sleep 2

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if node -e "require('mongoose').connect(process.env.MONGODB_URI).then(() => process.exit(0)).catch(() => process.exit(1))"; then
              echo "MongoDB ready"
              break
            fi
            sleep 2
          done

      - name: Run Live Agent Evaluation
        run: npm run agent:eval:live
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          REDIS_URL: redis://localhost:6379

      - name: Upload Evaluation Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-live-results
          path: |
            tests/agent/eval/reports/**
          retention-days: 7

  agent-typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit

  agent-lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint